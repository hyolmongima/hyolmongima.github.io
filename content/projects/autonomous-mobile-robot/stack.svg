<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" role="img" aria-label="Three layers from top to bottom: the Raspberry Pi sends velocity commands to the ESP32, which sends wheel speeds to the motor drivers. Measurements flow back up. The lidar, IMU and encoders feed the Pi, the ESP32 and the drivers.">
  <style>
    .am-box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .am-sensor { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .am-title { font: 600 14px var(--sans); fill: var(--fg); text-anchor: middle; }
    .am-sub { font: 12px var(--sans); fill: var(--muted); text-anchor: middle; }
    .am-name { font: 12px var(--sans); fill: var(--fg); text-anchor: middle; }
    .am-cmd { stroke: var(--accent); stroke-width: 1.5; fill: none; marker-end: url(#am-cmd-head); }
    .am-fb { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#am-fb-head); }
    .am-cmd-tip { stroke: var(--accent); stroke-width: 1.6; fill: none; }
    .am-fb-tip { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .am-cmd-label { font: 12px var(--sans); fill: var(--accent); text-anchor: end; }
    .am-fb-label { font: 12px var(--sans); fill: var(--muted); }
  </style>
  <defs>
    <marker id="am-cmd-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="am-cmd-tip" d="M1 1 L9 5 L1 9"/>
    </marker>
    <marker id="am-fb-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="am-fb-tip" d="M1 1 L9 5 L1 9"/>
    </marker>
  </defs>

  <!-- Pi -->
  <rect class="am-box" x="200" y="20" width="240" height="64" rx="6"/>
  <text class="am-title" x="320" y="47">Raspberry Pi 5</text>
  <text class="am-sub" x="320" y="67">ROS 2: SLAM, Nav2, odom pose</text>

  <!-- Pi to ESP32 -->
  <line class="am-cmd" x1="295" y1="88" x2="295" y2="154"/>
  <line class="am-fb" x1="345" y1="156" x2="345" y2="90"/>
  <text class="am-cmd-label" x="285" y="126">cmd_vel: v, &#969;</text>
  <text class="am-fb-label" x="355" y="118">velocity, covariance, flags</text>
  <text class="am-fb-label" x="355" y="134">100 Hz</text>

  <!-- ESP32 -->
  <rect class="am-box" x="200" y="160" width="240" height="64" rx="6"/>
  <text class="am-title" x="320" y="187">ESP32-S3</text>
  <text class="am-sub" x="320" y="207">velocity EKF, velocity loop, safety</text>

  <!-- ESP32 to drivers -->
  <line class="am-cmd" x1="295" y1="228" x2="295" y2="294"/>
  <line class="am-fb" x1="345" y1="296" x2="345" y2="230"/>
  <text class="am-cmd-label" x="285" y="266">wheel speeds</text>
  <text class="am-fb-label" x="355" y="266">encoder speed, current</text>

  <!-- Drivers -->
  <rect class="am-box" x="200" y="300" width="240" height="64" rx="6"/>
  <text class="am-title" x="320" y="327">Motor drivers</text>
  <text class="am-sub" x="320" y="347">wheel speed and current loops</text>

  <!-- Sensors -->
  <rect class="am-sensor" x="40" y="36" width="110" height="32" rx="16"/>
  <text class="am-name" x="95" y="56">2D lidar</text>
  <line class="am-fb" x1="152" y1="52" x2="196" y2="52"/>

  <rect class="am-sensor" x="40" y="176" width="110" height="32" rx="16"/>
  <text class="am-name" x="95" y="196">IMU</text>
  <line class="am-fb" x1="152" y1="192" x2="196" y2="192"/>

  <rect class="am-sensor" x="40" y="316" width="110" height="32" rx="16"/>
  <text class="am-name" x="95" y="336">encoders</text>
  <line class="am-fb" x1="152" y1="332" x2="196" y2="332"/>
</svg>
