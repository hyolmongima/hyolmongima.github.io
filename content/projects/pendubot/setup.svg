<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A Pendubot with a shoulder motor and encoder and an IMU on the second link hangs at rest, swings the free link up using shoulder torque, then balances both links inverted.">
  <style>
    .pb-ground { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 1 5; stroke-linecap: round; }
    .pb-link { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; fill: none; }
    .pb-ghost { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; fill: none; opacity: .18; }
    .pb-motor { fill: var(--accent); }
    .pb-encoder { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .pb-free { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
    .pb-imu { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
    .pb-tip { fill: var(--fg); }
    .pb-move { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; marker-end: url(#pb-head); }
    .pb-torque { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#pb-thead); }
    .pb-nudge { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-start: url(#pb-head); marker-end: url(#pb-head); }
    .pb-step { stroke: var(--rule); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pb-label { font: 500 14px var(--sans); fill: var(--fg); text-anchor: middle; }
    .pb-note { font: 12px var(--sans); fill: var(--muted); }
    .pb-sym { font: italic 14px var(--sans); fill: var(--accent); text-anchor: middle; }
  </style>
  <defs>
    <marker id="pb-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
    </marker>
    <marker id="pb-thead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    </marker>
  </defs>

  <line class="pb-ground" x1="30" y1="160" x2="270" y2="160"/>
  <line class="pb-ground" x1="330" y1="160" x2="570" y2="160"/>
  <line class="pb-ground" x1="630" y1="160" x2="870" y2="160"/>

  <path class="pb-step" d="M296 162 l8 8 -8 8"/>
  <path class="pb-step" d="M596 162 l8 8 -8 8"/>

  <!-- Rest: both links hang -->
  <polyline class="pb-link" points="150,160 150,225 150,295"/>
  <circle class="pb-tip" cx="150" cy="295" r="4"/>
  <rect class="pb-imu" x="144" y="254" width="12" height="12" rx="2"/>
  <circle class="pb-free" cx="150" cy="225" r="5"/>
  <circle class="pb-encoder" cx="150" cy="160" r="11"/>
  <circle class="pb-motor" cx="150" cy="160" r="7"/>
  <path class="pb-torque" d="M134.6 149 A19 19 0 0 1 165.4 149"/>
  <text class="pb-sym" x="150" y="130">&#964;</text>
  <text class="pb-note" x="126" y="150" text-anchor="end">motor + encoder</text>
  <text class="pb-note" x="164" y="229">free joint</text>
  <text class="pb-note" x="164" y="264">IMU</text>

  <!-- Swing up: shoulder pumps energy into the free link -->
  <polyline class="pb-ghost" points="450,160 417.5,216.3 441.3,282.1"/>
  <polyline class="pb-ghost" points="450,160 496,206 484.1,275"/>
  <path class="pb-move" d="M447 287 Q470 304 489 280 Q548 180 480 58"/>
  <polyline class="pb-link" points="450,160 496,114 472.2,48.2"/>
  <circle class="pb-tip" cx="472.2" cy="48.2" r="4"/>
  <rect class="pb-imu" x="478.1" y="75.1" width="12" height="12" rx="2" transform="rotate(-109.9 484.1 81.1)"/>
  <circle class="pb-free" cx="496" cy="114" r="5"/>
  <circle class="pb-encoder" cx="450" cy="160" r="11"/>
  <circle class="pb-motor" cx="450" cy="160" r="7"/>

  <!-- Balance: inverted, held by feedback -->
  <polyline class="pb-link" points="750,160 750,95 750,25"/>
  <circle class="pb-tip" cx="750" cy="25" r="4"/>
  <rect class="pb-imu" x="744" y="54" width="12" height="12" rx="2"/>
  <circle class="pb-free" cx="750" cy="95" r="5"/>
  <circle class="pb-encoder" cx="750" cy="160" r="11"/>
  <circle class="pb-motor" cx="750" cy="160" r="7"/>
  <path class="pb-nudge" d="M726.8 13.8 A148 148 0 0 1 773.2 13.8"/>

  <text class="pb-label" x="150" y="328">Rest</text>
  <text class="pb-label" x="450" y="328">Swing up</text>
  <text class="pb-label" x="750" y="328">Balance</text>
</svg>
