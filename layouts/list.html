{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{- range .Pages.GroupByDate "2006" }}
<section class="year-group">
  <h2 class="year">{{ .Key }}</h2>

</section>
{{- end }}
{{- else }}
{{ partial "note-list.html" .Pages }}
{{- end }}
{{ end }}
